# Build the site and deploy it to Cloudflare Pages on every push to main.
#
# Repository secrets needed (GitHub > Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   token with Account > Cloudflare Pages > Edit
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push cancels an older run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  PROJECT_NAME: sabinmainali
  PUBLIC_SITE_URL: https://sabinmainali.pages.dev
  WRANGLER_VERSION: 4.131.2

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build
        run: npm run verify -- --production

      - name: Create Pages project if missing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@"$WRANGLER_VERSION" pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME exists."
          else
            npx --yes wrangler@"$WRANGLER_VERSION" pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@"$WRANGLER_VERSION" pages deploy dist
          --project-name="$PROJECT_NAME"
          --branch=main
          --commit-hash="$GITHUB_SHA"
